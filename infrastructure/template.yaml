AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31

Description: >
  FlowForge serverless infrastructure:
  FastAPI Lambda, HTTP API, S3 document storage,
  DynamoDB persistence, Textract, Bedrock and CloudWatch.

Parameters:
  Environment:
    Type: String
    Default: staging
    AllowedValues:
      - development
      - staging
      - production

  BedrockRegion:
    Type: String
    Default: us-east-1

  BedrockModelId:
    Type: String
    Default: anthropic.claude-3-5-sonnet-20240620-v1:0

  BedrockFastModelId:
    Type: String
    Default: anthropic.claude-3-5-haiku-20241022-v1:0

  CorsOrigins:
    Type: String
    Default: '["http://localhost:5173"]'

  DocumentRetentionDays:
    Type: Number
    Default: 1
    MinValue: 1

  LogLevel:
    Type: String
    Default: INFO
    AllowedValues:
      - DEBUG
      - INFO
      - WARNING
      - ERROR

  MockLlm:
    Type: String
    Default: "false"
    AllowedValues:
      - "true"
      - "false"
    Description: >
      When true, uses MockLLMProvider for AI operations while continuing to use
      real AWS services (S3, Textract, DynamoDB, Lambda, API Gateway, CloudWatch).
      Set to false to enable live Bedrock model calls.

  AlarmEmail:
    Type: String
    Default: ""
    Description: >
      Optional email address for CloudWatch alarm notifications.
      Leave blank to skip SNS topic creation.

Conditions:
  HasAlarmEmail: !Not [!Equals [!Ref AlarmEmail, ""]]

Globals:
  Function:
    Runtime: python3.12
    MemorySize: 1024
    Timeout: 30
    Tracing: Active

Resources:

  # ==========================================================
  # API GATEWAY
  # ==========================================================

  FlowForgeHttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: !Ref Environment
      CorsConfiguration:
        AllowOrigins:
          - "*"
        AllowMethods:
          - GET
          - POST
          - PUT
          - DELETE
          - OPTIONS
        AllowHeaders:
          - Content-Type
          - Authorization
          - X-Requested-With

  # ==========================================================
  # S3 DOCUMENT STORAGE
  # ==========================================================

  DocumentBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

      ObjectOwnership: BucketOwnerEnforced

      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true

      LifecycleConfiguration:
        Rules:
          - Id: DeleteDemoUploads
            Status: Enabled
            Prefix: uploads/
            ExpirationInDays: !Ref DocumentRetentionDays
          - Id: AbortIncompleteMultipartUploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1

      VersioningConfiguration:
        Status: Suspended

      Tags:
        - Key: Project
          Value: FlowForge
        - Key: Environment
          Value: !Ref Environment

  # Deny unencrypted uploads and any non-TLS access
  DocumentBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref DocumentBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyUnencryptedUploads
            Effect: Deny
            Principal: "*"
            Action:
              - s3:PutObject
            Resource: !Sub "${DocumentBucket.Arn}/*"
            Condition:
              StringNotEquals:
                s3:x-amz-server-side-encryption: AES256
          - Sid: DenyNonTlsRequests
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource:
              - !Sub "${DocumentBucket.Arn}"
              - !Sub "${DocumentBucket.Arn}/*"
            Condition:
              Bool:
                aws:SecureTransport: "false"

  # ==========================================================
  # DYNAMODB
  # ==========================================================

  WorkflowsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST

      AttributeDefinitions:
        - AttributeName: workflowId
          AttributeType: S

      KeySchema:
        - AttributeName: workflowId
          KeyType: HASH

      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

      Tags:
        - Key: Project
          Value: FlowForge
        - Key: Environment
          Value: !Ref Environment

  DocumentsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST

      AttributeDefinitions:
        - AttributeName: workflowId
          AttributeType: S
        - AttributeName: documentId
          AttributeType: S

      KeySchema:
        - AttributeName: workflowId
          KeyType: HASH
        - AttributeName: documentId
          KeyType: RANGE

      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

      Tags:
        - Key: Project
          Value: FlowForge
        - Key: Environment
          Value: !Ref Environment

  AuditTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST

      AttributeDefinitions:
        - AttributeName: workflowId
          AttributeType: S
        - AttributeName: timestamp
          AttributeType: S

      KeySchema:
        - AttributeName: workflowId
          KeyType: HASH
        - AttributeName: timestamp
          KeyType: RANGE

      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

      Tags:
        - Key: Project
          Value: FlowForge
        - Key: Environment
          Value: !Ref Environment

  # ==========================================================
  # FASTAPI LAMBDA
  # ==========================================================

  FlowForgeApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/
      Handler: lambda_handler.lambda_handler

      Environment:
        Variables:
          APP_NAME: FlowForge
          ENVIRONMENT: !Ref Environment
          DEMO_MODE: "false"
          MOCK_LLM: !Ref MockLlm
          LOG_LEVEL: !Ref LogLevel
          API_GATEWAY_BASE_PATH: !Sub "/${Environment}"

          CORS_ORIGINS: !Ref CorsOrigins

          AWS_S3_BUCKET: !Ref DocumentBucket

          AWS_DYNAMODB_TABLE_WORKFLOWS: !Ref WorkflowsTable
          AWS_DYNAMODB_TABLE_DOCUMENTS: !Ref DocumentsTable
          AWS_DYNAMODB_TABLE_AUDIT: !Ref AuditTable

          BEDROCK_REGION: !Ref BedrockRegion
          BEDROCK_MODEL_ID: !Ref BedrockModelId
          BEDROCK_FAST_MODEL_ID: !Ref BedrockFastModelId

          MAX_DOCUMENT_SIZE_MB: "10"
          ALLOWED_MIME_TYPES: '["application/pdf","image/png","image/jpeg"]'

          CONFIDENCE_PASS: "0.85"
          CONFIDENCE_WARN: "0.60"
          WORKFLOW_RETRY_ON_INVALID: "true"

      Policies:

        # ----------------------------------------------------
        # S3
        # ----------------------------------------------------

        - Statement:
            - Sid: DocumentObjectReadWrite
              Effect: Allow
              Action:
                - s3:GetObject
                - s3:PutObject
                - s3:DeleteObject
              Resource: !Sub "${DocumentBucket.Arn}/uploads/*"

        # ----------------------------------------------------
        # DynamoDB
        # ----------------------------------------------------

        - Statement:
            - Sid: WorkflowTableAccess
              Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:UpdateItem
                - dynamodb:DeleteItem
                - dynamodb:Query
              Resource: !GetAtt WorkflowsTable.Arn

            - Sid: DocumentTableAccess
              Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:UpdateItem
                - dynamodb:DeleteItem
                - dynamodb:Query
              Resource: !GetAtt DocumentsTable.Arn

            - Sid: AuditTableAccess
              Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:Query
              Resource: !GetAtt AuditTable.Arn

        # ----------------------------------------------------
        # TEXTRACT
        # ----------------------------------------------------

        - Statement:
            - Sid: TextractDocumentText
              Effect: Allow
              Action:
                - textract:DetectDocumentText
              Resource: "*"

        # ----------------------------------------------------
        # BEDROCK
        # ----------------------------------------------------

        - Statement:
            - Sid: BedrockModelInvoke
              Effect: Allow
              Action:
                - bedrock:InvokeModel
              Resource:
                - !Sub "arn:${AWS::Partition}:bedrock:${BedrockRegion}:${AWS::AccountId}:inference-profile/${BedrockModelId}"
                - !Sub "arn:${AWS::Partition}:bedrock:${BedrockRegion}:${AWS::AccountId}:inference-profile/${BedrockFastModelId}"
                - !Sub "arn:${AWS::Partition}:bedrock:${BedrockRegion}:${AWS::AccountId}:inference-profile/*"
                - !Sub "arn:${AWS::Partition}:bedrock:${BedrockRegion}::foundation-model/${BedrockModelId}"
                - !Sub "arn:${AWS::Partition}:bedrock:${BedrockRegion}::foundation-model/${BedrockFastModelId}"
                - !Sub "arn:${AWS::Partition}:bedrock:*::foundation-model/amazon.nova-2-lite-v1:0"
                - !Sub "arn:${AWS::Partition}:bedrock:*::foundation-model/anthropic.*"

        # ----------------------------------------------------
        # CLOUDWATCH LOGS (Lambda auto-creates; explicit for SAM)
        # ----------------------------------------------------

        - Statement:
            - Sid: CloudWatchLogs
              Effect: Allow
              Action:
                - logs:CreateLogStream
                - logs:PutLogEvents
              Resource: !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/*"

      Events:

        RootRoute:
          Type: HttpApi
          Properties:
            ApiId: !Ref FlowForgeHttpApi
            Path: /
            Method: ANY

        ProxyRoute:
          Type: HttpApi
          Properties:
            ApiId: !Ref FlowForgeHttpApi
            Path: /{proxy+}
            Method: ANY

      Tags:
        Project: FlowForge
        Environment: !Ref Environment

  # ==========================================================
  # CLOUDWATCH LOG GROUP
  # ==========================================================

  FlowForgeApiLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${FlowForgeApiFunction}"
      RetentionInDays: 14

  # ==========================================================
  # CLOUDWATCH METRIC FILTERS
  # ==========================================================

  WorkflowCompletedMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref FlowForgeApiLogGroup
      FilterPattern: '"workflow_completed"'
      MetricTransformations:
        - MetricNamespace: FlowForge
          MetricName: WorkflowCompleted
          MetricValue: "1"

  WorkflowExecutionMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref FlowForgeApiLogGroup
      FilterPattern: '"workflow_execution_event"'
      MetricTransformations:
        - MetricNamespace: FlowForge
          MetricName: WorkflowExecutionEvents
          MetricValue: "1"

  ErrorMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref FlowForgeApiLogGroup
      FilterPattern: '"ERROR"'
      MetricTransformations:
        - MetricNamespace: FlowForge
          MetricName: ApplicationErrors
          MetricValue: "1"

  LambdaThrottleMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref FlowForgeApiLogGroup
      FilterPattern: '"ThrottlingException"'
      MetricTransformations:
        - MetricNamespace: FlowForge
          MetricName: BedrockThrottles
          MetricValue: "1"

  # ==========================================================
  # CLOUDWATCH ALARMS
  # ==========================================================

  # Optional SNS topic for alarm notifications
  AlarmTopic:
    Type: AWS::SNS::Topic
    Condition: HasAlarmEmail
    Properties:
      TopicName: !Sub "flowforge-${Environment}-alarms"
      Subscription:
        - Protocol: email
          Endpoint: !Ref AlarmEmail

  LambdaErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "flowforge-${Environment}-lambda-errors"
      AlarmDescription: >
        Fires when the FlowForge Lambda produces 5 or more application
        errors within a 5-minute window.
      Namespace: FlowForge
      MetricName: ApplicationErrors
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If
        - HasAlarmEmail
        - [!Ref AlarmTopic]
        - !Ref "AWS::NoValue"

  LambdaThrottleAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "flowforge-${Environment}-bedrock-throttles"
      AlarmDescription: >
        Fires when Bedrock throttling events reach 10 or more within
        a 5-minute window, indicating sustained capacity pressure.
      Namespace: FlowForge
      MetricName: BedrockThrottles
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 10
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If
        - HasAlarmEmail
        - [!Ref AlarmTopic]
        - !Ref "AWS::NoValue"

  LambdaDurationAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "flowforge-${Environment}-lambda-duration"
      AlarmDescription: >
        Fires when average Lambda duration exceeds 25 seconds (of the
        30-second timeout), indicating the function may start timing out.
      Namespace: AWS/Lambda
      MetricName: Duration
      Dimensions:
        - Name: FunctionName
          Value: !Ref FlowForgeApiFunction
      Statistic: Average
      Period: 300
      EvaluationPeriods: 2
      Threshold: 25000
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If
        - HasAlarmEmail
        - [!Ref AlarmTopic]
        - !Ref "AWS::NoValue"

Outputs:

  ApiUrl:
    Description: FlowForge HTTP API endpoint
    Value: !Sub >
      https://${FlowForgeHttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/${Environment}/

  DocumentBucketName:
    Description: Private S3 bucket for uploaded documents
    Value: !Ref DocumentBucket

  WorkflowsTableName:
    Description: DynamoDB workflows table
    Value: !Ref WorkflowsTable

  DocumentsTableName:
    Description: DynamoDB documents table
    Value: !Ref DocumentsTable

  AuditTableName:
    Description: DynamoDB audit table
    Value: !Ref AuditTable

  LambdaFunctionName:
    Description: FlowForge API Lambda
    Value: !Ref FlowForgeApiFunction

  LambdaFunctionArn:
    Description: FlowForge API Lambda ARN
    Value: !GetAtt FlowForgeApiFunction.Arn